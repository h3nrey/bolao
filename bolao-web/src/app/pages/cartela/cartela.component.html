<div class="flex flex-col gap-6 w-full animate-fadeIn text-left pb-16">

  <!-- Header Section -->
  <div class="flex flex-col text-left select-none">
    <h1 class="text-3xl font-black text-white tracking-tight leading-none mb-2 font-ui uppercase">
      Palpites
    </h1>
    <p class="text-xs text-slate-400 font-medium font-body uppercase tracking-wider">Envie seus palpites e simule as
      classificações</p>
  </div>

  <!-- Premium Timeline Progress Bar with Glowing Background -->
  @if (hasTournamentStarted()) {
  <div
    class="relative w-full p-6 md:p-8 rounded-[8px] border border-[#2A2B36] bg-[#14151A]/60 backdrop-blur-md overflow-hidden shadow-lg select-none mb-4">
    <!-- Glowing color gradient background -->
    <div
      class="absolute inset-0 opacity-15 pointer-events-none blur-[40px] bg-gradient-to-r from-[#E8001D] via-[#00D68F] via-[#0A84FF] via-[#FFB800] to-[#BF5AF2]">
    </div>

    <div class="relative w-full">
      <!-- Progress track line -->
      <div class="absolute top-[7px] left-[7px] right-[7px] h-0.5 bg-[#2A2B36] rounded-full"></div>

      <!-- Active progress line filled dynamically -->
      <div class="absolute top-[7px] left-[7px] h-0.5 bg-white transition-all duration-300 rounded-full"
        [style.width.%]="(activeStepIndex() / (steps.length - 1)) * 98"></div>

      <!-- Nodes Container -->
      <div class="relative flex justify-between items-center w-full z-10">
        @for (step of steps; track step.id; let idx = $index) {
        <div class="flex flex-col items-center">
          <!-- Node Dot -->
          <div [class.bg-white]="idx <= activeStepIndex()" [class.border-white]="idx <= activeStepIndex()"
            [class.bg-[#0D0D0F]]="idx > activeStepIndex()" [class.border-[#2A2B36]]="idx > activeStepIndex()"
            class="w-3.5 h-3.5 rounded-full border-2 transition-all duration-200"></div>

          <!-- Node Label -->
          <span [class.text-white]="idx === activeStepIndex()" [class.font-black]="idx === activeStepIndex()"
            [class.text-slate-400]="idx !== activeStepIndex()"
            class="text-[10px] font-bold uppercase tracking-wider mt-3 font-ui transition-all">
            {{ step.label }}
          </span>
        </div>
        }
      </div>
    </div>
  </div>
  }

  <!-- Stage Navigation Tab Selector -->
  <div class="w-full mb-2">
    <app-tab-selector [options]="tabOptions" [activeId]="activeTabId()"
      (tabChange)="onTabChange($event)"></app-tab-selector>
  </div>

  <!-- Child routes render here -->
  <router-outlet></router-outlet>

</div>
