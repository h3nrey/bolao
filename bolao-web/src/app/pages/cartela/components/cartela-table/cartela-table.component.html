<div class="flex flex-col gap-3">
  <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest select-none font-ui">
    Classificação
  </div>
  
  <div class="w-full overflow-x-auto no-scrollbar border border-[#2A2B36] rounded-[6px] bg-[#14151A]">
    <table class="w-full text-left border-collapse min-w-[280px]">
      <thead>
        <tr class="border-b border-[#2A2B36] text-[9px] font-black text-slate-500 select-none font-ui bg-[#1C1D24]">
          <th class="py-2.5 px-4 font-black">Seleção</th>
          <th class="py-2.5 px-2 text-center w-8">P</th>
          <th class="py-2.5 px-2 text-center w-8">J</th>
          <th class="py-2.5 px-2 text-center w-8">V</th>
          <th class="py-2.5 px-2 text-center w-8">E</th>
          <th class="py-2.5 px-2 text-center w-8">D</th>
          <th class="py-2.5 px-4 text-center w-10">SG</th>
        </tr>
      </thead>
      <tbody>
        @for (row of standings(); track row.team.id; let idx = $index) {
          <tr 
            class="border-b border-[#2A2B36]/40 last:border-none hover:bg-[#22232D]/50 text-xs transition-colors"
            [class.bg-[#0A1E18]]="idx < 2"
          >
            <td class="py-2.5 px-4 flex items-center gap-2.5">
              <!-- Qualification zones indicator: top 2 green, bottom 2 gray -->
              <span class="font-extrabold text-[11px] w-4 shrink-0 text-center font-display" 
                    [class.text-[#00D68F]]="idx < 2"
                    [class.text-slate-600]="idx >= 2">
                {{ idx + 1 }}.
              </span>
              
              <!-- Round Flag Image matching mockup -->
              @if (row.team.flag_url) {
                <img [src]="row.team.flag_url" class="w-4.5 h-4.5 rounded-full object-cover shrink-0 select-none shadow-[0_0_4px_rgba(0,0,0,0.6)]" [alt]="row.team.name" />
              }
              
              <span class="font-bold text-white tracking-wide truncate max-w-[120px] md:max-w-none">{{ row.team.name }}</span>
            </td>
            <td class="py-2.5 px-2 text-center font-black text-white w-8 font-display">{{ row.P }}</td>
            <td class="py-2.5 px-2 text-center font-bold text-slate-400 w-8 font-display">{{ row.J }}</td>
            <td class="py-2.5 px-2 text-center font-semibold text-slate-400 w-8 font-display">{{ row.V }}</td>
            <td class="py-2.5 px-2 text-center font-semibold text-slate-400 w-8 font-display">{{ row.E }}</td>
            <td class="py-2.5 px-2 text-center font-semibold text-slate-400 w-8 font-display">{{ row.D }}</td>
            <td class="py-2.5 px-4 text-center font-bold text-slate-400 w-10 font-display" [class.text-[#00D68F]]="row.SG > 0" [class.text-[#E8001D]]="row.SG < 0">{{ row.SG }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
