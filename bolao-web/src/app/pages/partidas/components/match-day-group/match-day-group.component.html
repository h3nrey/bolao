<div class="flex flex-col gap-4 w-full">

  <!-- Date label header -->
  <div class="flex items-center gap-3">
    <span class="text-[10px] font-black uppercase text-[#9B9BAD] tracking-widest bg-[#14151A] border border-[#2A2B36] px-2.5 py-1.5 rounded-[4px] select-none font-ui">
      {{ dateLabel() }}
    </span>
    <div class="flex-1 h-px bg-[#2A2B36]"></div>
  </div>

  <!-- Match cards grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full">
    @for (match of matches(); track match.id) {
      <app-match-card
        [match]="match"
        (cardClick)="matchClick.emit($event)"
      />
    }
  </div>

</div>
