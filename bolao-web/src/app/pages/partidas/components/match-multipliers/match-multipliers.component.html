<div class="flex flex-col gap-5 bg-[#14151A] border border-[#2A2B36] rounded-[8px] p-4 md:p-5 shadow-sm">
  <h3 class="text-sm font-black text-[#F0F0F5] tracking-wider uppercase border-b border-[#2A2B36] pb-3 flex items-center gap-2 select-none font-ui">
    <span class="w-2 h-2 bg-brand-red rounded-[2px] inline-block"></span>
    Multiplicadores (Palpites Extras)
  </h3>

  <div class="flex flex-col gap-4">
    <!-- Player to Score Dropdown -->
    <div class="flex flex-col gap-1.5 overflow-visible">
      <app-form-select
        id="multiplier-scorer"
        label="Qual jogador marcará gol?"
        [options]="playerSelectOptions()"
        [value]="scorerPlayerId()"
        [disabled]="disabled()"
        placeholder="Selecione um jogador"
        (valueChange)="selectScorerPlayer($event)"
      ></app-form-select>
    </div>

    <!-- First Goal Team Dropdown -->
    <div class="flex flex-col gap-1.5 overflow-visible">
      <app-form-select
        id="multiplier-first-goal"
        label="Primeiro time a marcar gol"
        [options]="teamSelectOptions()"
        [value]="firstGoalTeamId()"
        [disabled]="disabled()"
        placeholder="Selecione o time"
        (valueChange)="selectFirstGoalTeam($event)"
      ></app-form-select>
    </div>
  </div>

  <div class="flex flex-col gap-5 items-center border-t border-[#2A2B36]/60 pt-4 mt-1">
    <!-- Steppers Row -->
    <div class="grid grid-cols-2 gap-4 w-full justify-items-center">
      <!-- Cards quantity stepper -->
      <div class="flex flex-col items-center">
        <app-score-stepper
          [value]="cardsQuantity()"
          label="Quantidade de Cartões"
          [disabled]="disabled()"
          (valueChange)="cardsQuantityChange.emit($event)"
        ></app-score-stepper>
      </div>

      <!-- Corners quantity stepper -->
      <div class="flex flex-col items-center">
        <app-score-stepper
          [value]="cornersQuantity()"
          label="Quantidade de Escanteios"
          [disabled]="disabled()"
          (valueChange)="cornersQuantityChange.emit($event)"
        ></app-score-stepper>
      </div>
    </div>

    <!-- Both Teams to Score toggle buttons -->
    <div class="flex flex-col items-center gap-2 select-none border-t border-[#2A2B36]/30 pt-3 w-full">
      <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider text-center">Ambos os Times Marcam?</span>
      
      <div class="flex items-center w-full max-w-[140px] bg-[#0A0E18]/80 border border-white/10 rounded-2xl overflow-hidden h-12 p-0.5">
        <button
          type="button"
          (click)="setBothTeamsScore(1)"
          [disabled]="disabled()"
          class="flex-1 h-full flex items-center justify-center text-xs font-bold uppercase transition-all duration-150 border-none outline-none cursor-pointer rounded-xl"
          [class.bg-brand-red]="bothTeamsScore() === 1"
          [class.text-white]="bothTeamsScore() === 1"
          [class.text-slate-400]="bothTeamsScore() !== 1"
          [class.hover:text-white]="!disabled() && bothTeamsScore() !== 1"
          style="background: transparent;"
        >
          Sim
        </button>
        <button
          type="button"
          (click)="setBothTeamsScore(0)"
          [disabled]="disabled()"
          class="flex-1 h-full flex items-center justify-center text-xs font-bold uppercase transition-all duration-150 border-none outline-none cursor-pointer rounded-xl"
          [class.bg-brand-red]="bothTeamsScore() === 0"
          [class.text-white]="bothTeamsScore() === 0"
          [class.text-slate-400]="bothTeamsScore() !== 0"
          [class.hover:text-white]="!disabled() && bothTeamsScore() !== 0"
          style="background: transparent;"
        >
          Não
        </button>
      </div>
    </div>
  </div>
</div>
