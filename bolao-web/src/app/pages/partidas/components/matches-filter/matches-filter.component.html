<div class="flex flex-wrap items-center gap-3 bg-[#14151A] border border-[#2A2B36] p-4 rounded-[8px]">
  <!-- Group Filter Select -->
  <div class="flex flex-col gap-1.5">
    <label class="text-[9px] font-black uppercase tracking-wider text-[#9B9BAD] font-ui">Grupo</label>
    <select 
      [value]="selectedGroupId() || ''"
      (change)="onGroupChange($event)"
      class="bg-[#0D0D0F] border border-[#2A2B36] text-xs font-bold text-[#F0F0F5] px-3 py-2 rounded-[6px] outline-none cursor-pointer focus:border-[#E8001D] transition-colors min-w-[140px] font-ui"
    >
      <option value="">Todos os Grupos</option>
      @for (g of groups(); track g.id) {
        <option [value]="g.id">{{ g.name }}</option>
      }
    </select>
  </div>

  <!-- Date Filter Select -->
  <div class="flex flex-col gap-1.5">
    <label class="text-[9px] font-black uppercase tracking-wider text-[#9B9BAD] font-ui">Data</label>
    <select 
      [value]="selectedDate() || ''"
      (change)="onDateChange($event)"
      class="bg-[#0D0D0F] border border-[#2A2B36] text-xs font-bold text-[#F0F0F5] px-3 py-2 rounded-[6px] outline-none cursor-pointer focus:border-[#E8001D] transition-colors min-w-[140px] font-ui"
    >
      <option value="">Todas as Datas</option>
      @for (d of dates(); track d.id) {
        <option [value]="d.id">{{ d.label }}</option>
      }
    </select>
  </div>

  <!-- Clear Filters Button -->
  @if (selectedGroupId() || selectedDate()) {
    <button 
      (click)="onClear()"
      class="mt-5 flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-bold text-[#E8001D] bg-[#E8001D]/10 hover:bg-[#E8001D]/20 border border-[#E8001D]/20 rounded-[6px] transition-colors cursor-pointer font-ui uppercase tracking-wider"
    >
      Limpar Filtros
    </button>
  }
</div>
