<div class="relative w-full bg-[#14151A] border border-[#2A2B36] p-4 rounded-[8px]">
  <!-- Clear Filters Button (absolute top-right corner) -->


  <!-- Filters Container (2 columns on mobile, row wrap on desktop) -->
  <div class="grid grid-cols-2 md:flex md:flex-wrap md:items-end gap-3 pr-8 md:pr-12">
    <!-- Group Filter Select -->
    <div class="flex flex-col gap-1 w-full md:w-auto">
      <label class="text-[9px] font-black uppercase tracking-wider text-[#9B9BAD] font-ui">Grupo</label>
      <select [value]="selectedGroupId() || ''" (change)="onGroupChange($event)"
        class="bg-[#0D0D0F] border border-[#2A2B36] text-xs font-bold text-[#F0F0F5] px-3 py-2 rounded-[6px] outline-none cursor-pointer focus:border-[#E8001D] transition-colors w-full md:min-w-[140px] font-ui">
        <option value="">Todos os Grupos</option>
        @for (g of groups(); track g.id) {
        <option [value]="g.id">{{ g.name }}</option>
        }
      </select>
    </div>

    <!-- Date Filter Select -->
    <div class="flex flex-col gap-1 w-full md:w-auto">
      <label class="text-[9px] font-black uppercase tracking-wider text-[#9B9BAD] font-ui">Data</label>
      <select [value]="selectedDate() || ''" (change)="onDateChange($event)"
        class="bg-[#0D0D0F] border border-[#2A2B36] text-xs font-bold text-[#F0F0F5] px-3 py-2 rounded-[6px] outline-none cursor-pointer focus:border-[#E8001D] transition-colors w-full md:min-w-[140px] font-ui">
        <option value="">Todas as Datas</option>
        @for (d of dates(); track d.id) {
        <option [value]="d.id">{{ d.label }}</option>
        }
      </select>
    </div>

    <!-- Team Filter Select -->
    <div class="flex flex-col gap-1 w-full md:w-auto">
      <label class="text-[9px] font-black uppercase tracking-wider text-[#9B9BAD] font-ui">Time / Seleção</label>
      <select [value]="selectedTeamId() || ''" (change)="onTeamChange($event)"
        class="bg-[#0D0D0F] border border-[#2A2B36] text-xs font-bold text-[#F0F0F5] px-3 py-2 rounded-[6px] outline-none cursor-pointer focus:border-[#E8001D] transition-colors w-full md:min-w-[140px] font-ui">
        <option value="">Todos os Times</option>
        @for (t of teams(); track t.id) {
        <option [value]="t.id">{{ t.name }}</option>
        }
      </select>
    </div>

    <!-- Status Filter Select -->
    <div class="flex flex-col gap-1 w-full md:w-auto">
      <label class="text-[9px] font-black uppercase tracking-wider text-[#9B9BAD] font-ui">Status</label>
      <select [value]="selectedStatus() || ''" (change)="onStatusChange($event)"
        class="bg-[#0D0D0F] border border-[#2A2B36] text-xs font-bold text-[#F0F0F5] px-3 py-2 rounded-[6px] outline-none cursor-pointer focus:border-[#E8001D] transition-colors w-full md:min-w-[140px] font-ui">
        <option value="">Todos os Status</option>
        <option value="upcoming">Aberta</option>
        <option value="live">Ao Vivo</option>
        <option value="finished">Finalizada</option>
      </select>
    </div>

    @if (selectedGroupId() || selectedDate() || selectedTeamId() || selectedStatus()) {
    <button (click)="onClear()"
      class="col-span-2 md:col-span-1 flex items-center justify-center gap-2 w-full md:w-auto md:px-4 h-[38px] rounded-[6px] text-[#E8001D] bg-[#E8001D]/10 hover:bg-[#E8001D]/20 border border-[#E8001D]/20 hover:border-[#E8001D] transition-all duration-150 cursor-pointer font-ui"
      title="Limpar Filtros">
      <span class="text-xs font-bold md:hidden">Limpar Filtros</span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
        class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    }
  </div>
</div>
