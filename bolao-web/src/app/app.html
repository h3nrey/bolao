@if (user()) {
  <!-- Full Screen Premium Dashboard Layout in Column -->
  <div class="h-screen w-full flex flex-col bg-[#0D0D0F] text-slate-100 font-sans overflow-hidden animate-fadeIn select-none">
    
    <!-- Top Countdown Banner Component -->
    @if (!hasTournamentStarted()) {
      <app-countdown-banner></app-countdown-banner>
    }

    <!-- Mobile Top Header -->
    <header class="md:hidden w-full flex items-center justify-between px-4 py-3 bg-[#14151A] border-b border-[#2A2B36] sticky top-0 z-40 shadow-sm shrink-0">
      <div class="flex items-center gap-3">
        <button (click)="isMobileMenuOpen.set(true)" class="flex items-center justify-center text-slate-300 hover:text-white bg-transparent border-none cursor-pointer outline-none">
          <svg lucideMenu class="w-5.5 h-5.5"></svg>
        </button>
        <app-logo (click)="navigate('/ranking')" class="cursor-pointer"></app-logo>
      </div>
      
      <!-- User profile avatar linking to My Profile -->
      <div class="flex items-center">
        <button (click)="viewMyProfile()" class="relative shrink-0 select-none outline-none border-none bg-transparent cursor-pointer">
          @if (user()?.avatar_url) {
            <img [src]="user()?.avatar_url" alt="Avatar" class="w-8 h-8 rounded-full object-cover border border-[#2A2B36]" />
          } @else {
            <div class="w-8 h-8 rounded-full bg-[#E8001D] text-white flex items-center justify-center text-xs font-black border border-[#2A2B36] font-ui uppercase">
              {{ user()?.name?.charAt(0)?.toUpperCase() }}
            </div>
          }
        </button>
      </div>
    </header>

    <!-- Content Area below Banner -->
    <div class="flex flex-1 overflow-hidden">
      <!-- Left Sidebar Component - Hidden on Mobile -->
      <app-sidebar 
        class="hidden md:block shrink-0 h-full"
        [user]="user()" 
        (logoutRequested)="logout()"
        (quickBetRequested)="isQuickBetModalOpen.set(true)"
      ></app-sidebar>

      <!-- Main Content Pane -->
      <main class="flex-1 overflow-y-auto p-4 pb-24 md:p-8 bg-[#0D0D0F] flex flex-col">
        <!-- Dynamic Pages wrapper -->
        <div class="max-w-6xl w-full mx-auto">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#14151A] border-t border-[#2A2B36] px-2 py-2 flex items-center justify-around shadow-md">
      <!-- Item 1: Trophy / Classificação -->
      <button 
        (click)="navigate('/ranking')"
        class="flex flex-col items-center justify-center gap-1.5 py-1 px-3 bg-transparent border-none cursor-pointer transition-all duration-200 outline-none"
        [class.text-[#E8001D]]="isActive('/ranking')"
        [class.text-slate-400]="!isActive('/ranking')"
      >
        <svg lucideTrophy class="w-4.5 h-4.5"></svg>
        <span class="text-[8px] font-black uppercase tracking-wider font-ui">Ranking</span>
      </button>

      <!-- Item 2: Users / Participantes -->
      <button 
        (click)="navigate('/participantes')"
        class="flex flex-col items-center justify-center gap-1.5 py-1 px-3 bg-transparent border-none cursor-pointer transition-all duration-200 outline-none"
        [class.text-[#E8001D]]="isActive('/participantes')"
        [class.text-slate-400]="!isActive('/participantes')"
      >
        <svg lucideUsers class="w-4.5 h-4.5"></svg>
        <span class="text-[8px] font-black uppercase tracking-wider font-ui">Membros</span>
      </button>

      <!-- Central Quick Bet Item -->
      <button 
        (click)="isQuickBetModalOpen.set(true)"
        class="flex items-center justify-center bg-[#E8001D] hover:bg-[#FF1A35] text-white w-10 h-10 rounded-full cursor-pointer transition-all duration-150 outline-none border-none shadow-md shrink-0 active:scale-95"
        title="Palpitar Rapidamente"
      >
        <svg lucidePlus class="w-5 h-5 block"></svg>
      </button>

      <!-- Item 3: Calendar / Partidas -->
      <button 
        (click)="navigate('/partidas')"
        class="flex flex-col items-center justify-center gap-1.5 py-1 px-3 bg-transparent border-none cursor-pointer transition-all duration-200 outline-none"
        [class.text-[#E8001D]]="isActive('/partidas')"
        [class.text-slate-400]="!isActive('/partidas')"
      >
        <svg lucideCalendar class="w-4.5 h-4.5"></svg>
        <span class="text-[8px] font-black uppercase tracking-wider font-ui">Jogos</span>
      </button>

      <!-- Item 4: FileText / Regras -->
      <button 
        (click)="navigate('/regras')"
        class="flex flex-col items-center justify-center gap-1.5 py-1 px-3 bg-transparent border-none cursor-pointer transition-all duration-200 outline-none"
        [class.text-[#E8001D]]="isActive('/regras')"
        [class.text-slate-400]="!isActive('/regras')"
      >
        <svg lucideFileText class="w-4.5 h-4.5"></svg>
        <span class="text-[8px] font-black uppercase tracking-wider font-ui">Regras</span>
      </button>
    </nav>

    <!-- Slide-out Left Mobile Drawer Overlay & Sidebar Content -->
    @if (isMobileMenuOpen()) {
      <!-- Dark backdrop overlay (Structural Black only) -->
      <div 
        class="fixed inset-0 bg-black/60 z-[60] animate-fadeIn" 
        (click)="isMobileMenuOpen.set(false)"
      ></div>

      <!-- Mobile drawer sidebar -->
      <aside 
        class="fixed top-0 bottom-0 left-0 w-60 bg-[#14151A] border-r border-[#2A2B36] flex flex-col justify-between p-6 z-[70] shadow-md animate-slideInLeft select-none rounded-none"
      >
        <div class="flex flex-col gap-6">
          <!-- Logo & Close button in drawer header -->
          <div class="flex items-center justify-between">
            <app-logo (click)="isMobileMenuOpen.set(false); navigate('/ranking')" class="cursor-pointer"></app-logo>
            <button (click)="isMobileMenuOpen.set(false)" class="text-slate-400 hover:text-white bg-transparent border-none cursor-pointer p-1">
              <svg lucideX class="w-5 h-5"></svg>
            </button>
          </div>

          <!-- Vertical drawer navigation links (Strictly flat/opaque) -->
          <nav class="flex flex-col gap-2 mt-4 text-left">
            <button 
              (click)="isMobileMenuOpen.set(false); navigate('/ranking')" 
              class="flex items-center gap-3 py-3 px-4 rounded-[4px] font-bold text-xs uppercase tracking-wider text-left transition-colors duration-80 border-none cursor-pointer font-ui border-l-2"
              [class.bg-[#1C1D24]]="isActive('/ranking')"
              [class.border-[#E8001D]]="isActive('/ranking')"
              [class.text-white]="isActive('/ranking')"
              [class.bg-transparent]="!isActive('/ranking')"
              [class.border-transparent]="!isActive('/ranking')"
              [class.text-[#9B9BAD]]="!isActive('/ranking')"
              [class.hover:text-[#F0F0F5]]="!isActive('/ranking')"
              [class.hover:bg-[#14151A]]="!isActive('/ranking')"
              [class.hover:border-[#2A2B36]]="!isActive('/ranking')"
            >
              <svg lucideTrophy class="w-4.5 h-4.5" [class.text-[#E8001D]]="isActive('/ranking')"></svg>
              Classificação
            </button>

            <button 
              (click)="isMobileMenuOpen.set(false); navigate('/participantes')" 
              class="flex items-center gap-3 py-3 px-4 rounded-[4px] font-bold text-xs uppercase tracking-wider text-left transition-colors duration-80 border-none cursor-pointer font-ui border-l-2"
              [class.bg-[#1C1D24]]="isActive('/participantes')"
              [class.border-[#E8001D]]="isActive('/participantes')"
              [class.text-white]="isActive('/participantes')"
              [class.bg-transparent]="!isActive('/participantes')"
              [class.border-transparent]="!isActive('/participantes')"
              [class.text-[#9B9BAD]]="!isActive('/participantes')"
              [class.hover:text-[#F0F0F5]]="!isActive('/participantes')"
              [class.hover:bg-[#14151A]]="!isActive('/participantes')"
              [class.hover:border-[#2A2B36]]="!isActive('/participantes')"
            >
              <svg lucideUsers class="w-4.5 h-4.5" [class.text-[#E8001D]]="isActive('/participantes')"></svg>
              Participantes
            </button>

            <button 
              (click)="isMobileMenuOpen.set(false); navigate('/partidas')" 
              class="flex items-center gap-3 py-3 px-4 rounded-[4px] font-bold text-xs uppercase tracking-wider text-left transition-colors duration-80 border-none cursor-pointer font-ui border-l-2"
              [class.bg-[#1C1D24]]="isActive('/partidas')"
              [class.border-[#E8001D]]="isActive('/partidas')"
              [class.text-white]="isActive('/partidas')"
              [class.bg-transparent]="!isActive('/partidas')"
              [class.border-transparent]="!isActive('/partidas')"
              [class.text-[#9B9BAD]]="!isActive('/partidas')"
              [class.hover:text-[#F0F0F5]]="!isActive('/partidas')"
              [class.hover:bg-[#14151A]]="!isActive('/partidas')"
              [class.hover:border-[#2A2B36]]="!isActive('/partidas')"
            >
              <svg lucideCalendar class="w-4.5 h-4.5" [class.text-[#E8001D]]="isActive('/partidas')"></svg>
              Partidas
            </button>

            <button 
              (click)="isMobileMenuOpen.set(false); navigate('/especiais')" 
              class="flex items-center gap-3 py-3 px-4 rounded-[4px] font-bold text-xs uppercase tracking-wider text-left transition-colors duration-80 border-none cursor-pointer font-ui border-l-2"
              [class.bg-[#1C1D24]]="isActive('/especiais')"
              [class.border-[#E8001D]]="isActive('/especiais')"
              [class.text-white]="isActive('/especiais')"
              [class.bg-transparent]="!isActive('/especiais')"
              [class.border-transparent]="!isActive('/especiais')"
              [class.text-[#9B9BAD]]="!isActive('/especiais')"
              [class.hover:text-[#F0F0F5]]="!isActive('/especiais')"
              [class.hover:bg-[#14151A]]="!isActive('/especiais')"
              [class.hover:border-[#2A2B36]]="!isActive('/especiais')"
            >
              <svg lucideAward class="w-4.5 h-4.5" [class.text-[#E8001D]]="isActive('/especiais')"></svg>
              Especiais
            </button>

            <button 
              (click)="isMobileMenuOpen.set(false); navigate('/regras')" 
              class="flex items-center gap-3 py-3 px-4 rounded-[4px] font-bold text-xs uppercase tracking-wider text-left transition-colors duration-80 border-none cursor-pointer font-ui border-l-2"
              [class.bg-[#1C1D24]]="isActive('/regras')"
              [class.border-[#E8001D]]="isActive('/regras')"
              [class.text-white]="isActive('/regras')"
              [class.bg-transparent]="!isActive('/regras')"
              [class.border-transparent]="!isActive('/regras')"
              [class.text-[#9B9BAD]]="!isActive('/regras')"
              [class.hover:text-[#F0F0F5]]="!isActive('/regras')"
              [class.hover:bg-[#14151A]]="!isActive('/regras')"
              [class.hover:border-[#2A2B36]]="!isActive('/regras')"
            >
              <svg lucideFileText class="w-4.5 h-4.5" [class.text-[#E8001D]]="isActive('/regras')"></svg>
              Regras
            </button>

            <button 
              (click)="isMobileMenuOpen.set(false); navigate('/perfil')" 
              class="flex items-center gap-3 py-3 px-4 rounded-[4px] font-bold text-xs uppercase tracking-wider text-left transition-colors duration-80 border-none cursor-pointer font-ui border-l-2"
              [class.bg-[#1C1D24]]="isActive('/perfil')"
              [class.border-[#E8001D]]="isActive('/perfil')"
              [class.text-white]="isActive('/perfil')"
              [class.bg-transparent]="!isActive('/perfil')"
              [class.border-transparent]="!isActive('/perfil')"
              [class.text-[#9B9BAD]]="!isActive('/perfil')"
              [class.hover:text-[#F0F0F5]]="!isActive('/perfil')"
              [class.hover:bg-[#14151A]]="!isActive('/perfil')"
              [class.hover:border-[#2A2B36]]="!isActive('/perfil')"
            >
              <svg lucideUser class="w-4.5 h-4.5" [class.text-[#E8001D]]="isActive('/perfil')"></svg>
              Meu Perfil
            </button>

            @if (user()?.is_admin) {
              <button 
                (click)="isMobileMenuOpen.set(false); navigate('/admin')" 
                class="flex items-center gap-3 py-3 px-4 rounded-[4px] font-bold text-xs uppercase tracking-wider text-left transition-colors duration-80 border-none cursor-pointer font-ui border-l-2"
                [class.bg-[#1C1D24]]="isActive('/admin')"
                [class.border-[#E8001D]]="isActive('/admin')"
                [class.text-white]="isActive('/admin')"
                [class.bg-transparent]="!isActive('/admin')"
                [class.border-transparent]="!isActive('/admin')"
                [class.text-[#9B9BAD]]="!isActive('/admin')"
                [class.hover:text-[#F0F0F5]]="!isActive('/admin')"
                [class.hover:bg-[#14151A]]="!isActive('/admin')"
                [class.hover:border-[#2A2B36]]="!isActive('/admin')"
              >
                <svg lucideShield class="w-4.5 h-4.5" [class.text-[#E8001D]]="isActive('/admin')"></svg>
                Painel Admin
              </button>
            }
          </nav>
        </div>

        <!-- Reusable User Footer at the bottom of the drawer -->
        <div class="border-t border-[#2A2B36] pt-4">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              @if (user()?.avatar_url) {
                <img [src]="user()?.avatar_url" alt="Avatar" class="w-9 h-9 rounded-full object-cover border border-[#2A2B36] shrink-0 animate-fadeIn" />
              } @else {
                <div class="w-9 h-9 rounded-full bg-[#E8001D] text-white flex items-center justify-center text-sm font-black border border-[#2A2B36] shrink-0 font-ui uppercase">
                  {{ user()?.name?.charAt(0)?.toUpperCase() }}
                </div>
              }
              <div class="flex flex-col text-left min-w-0">
                <span class="text-xs font-bold text-white truncate leading-tight font-body">{{ user()?.name }}</span>
                <span class="text-[9px] text-slate-500 truncate leading-none mt-0.5 font-body">{{ user()?.email }}</span>
              </div>
            </div>
            <button (click)="isMobileMenuOpen.set(false); logout()" class="p-2 bg-[#1C1D24] hover:bg-[#1A0005] text-slate-400 hover:text-[#E8001D] border border-[#2A2B36] hover:border-[#E8001D] rounded-[3px] cursor-pointer transition-colors duration-80 outline-none" title="Sair">
              <svg lucideLogOut class="w-4 h-4"></svg>
            </button>
          </div>
        </div>
      </aside>
    }
  </div>

  <!-- Quick Prediction Modal Component -->
  <app-quick-bet-modal
    [open]="isQuickBetModalOpen()"
    (close)="isQuickBetModalOpen.set(false)"
  ></app-quick-bet-modal>

  <app-profile-completion-modal
    [open]="isProfileIncomplete()"
    [loading]="completeProfileLoading()"
    [error]="completeProfileError()"
    [name]="completeProfileName()"
    [project]="completeProfileProject()"
    [seniority]="completeProfileSeniority()"
    (nameChange)="completeProfileName.set($event)"
    (projectChange)="completeProfileProject.set($event)"
    (seniorityChange)="completeProfileSeniority.set($event)"
    (save)="submitProfileUpdate()"
    (logout)="logout()"
  ></app-profile-completion-modal>
} @else {
  <!-- Centered Login Layout (Opaque & Sharp borders) -->
  <div class="min-h-screen w-full flex items-center justify-center p-4 bg-[#0D0D0F] font-sans">
    <div class="bg-[#14151A] border border-[#2A2B36] rounded-none shadow-lg p-6 md:p-8 transition-all duration-300 w-full max-w-md animate-fadeIn">
      <app-login 
        [loading]="loading()" 
        [error]="error()" 
        [initialToken]="token()"
        (tokenConnected)="onTokenConnected($event)"
        (redirectToGoogleRequested)="redirectToGoogle()"
      ></app-login>
    </div>
  </div>
}
