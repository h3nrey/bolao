@if (showScrollTop()) {
<button (click)="scrollToTop()"
  class="fixed bottom-20 md:bottom-8 right-6 z-50 flex items-center justify-center w-10 h-10 bg-[#E8001D] hover:bg-[#FF1A35] text-white border border-[#E8001D] rounded-md shadow-lg hover:shadow-xl transition-all duration-200 cursor-pointer animate-fadeIn"
  title="Voltar ao Topo"><svg lucideChevronUp class="w-5 h-5 block"></svg></button>
}
