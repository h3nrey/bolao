<div
  class="fixed bottom-6 left-[50%] z-50 w-[calc(100%-2rem)] max-w-2xl bg-[#14151A] border border-[#2A2B36] border-l-4 border-l-[#E8001D] p-4 flex flex-col md:flex-row items-center justify-between gap-4 shadow-[0_16px_36px_rgba(0,0,0,0.85)] select-none animate-slideInUp"
  style="transform: translate(-50%, 0);">

  <!-- Selected Info & Items List -->
  <div class="flex flex-col lg:flex-row lg:items-center gap-3.5 w-full md:w-auto overflow-hidden min-w-0">
    <div class="flex items-center gap-2 shrink-0">
      <div
        class="h-6 px-2.5 bg-[#E8001D] text-white flex items-center justify-center text-[10px] font-black uppercase rounded-none font-ui tracking-wider select-none">
        {{ items().length }} Selecionado(s)
      </div>
    </div>

    <!-- Badges list (wrapping flex) -->
    <div class="flex flex-wrap gap-2 py-1 max-h-32 overflow-y-auto custom-scrollbar">
      @for (item of items(); track item.id) {
      <span
        class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-[#1C1D24] border border-[#2A2B36] text-[10px] font-bold text-slate-300 uppercase tracking-wide rounded-none font-ui shrink-0 max-w-[180px] truncate select-none">
        @if (item.emoji) {
        <span class="text-xs shrink-0 select-none">{{ item.emoji }}</span>
        }
        <span class="truncate mr-1">{{ item.label }}</span>
        <button (click)="onRemove(item.id)"
          class="text-slate-500 hover:text-[#E8001D] p-0.5 hover:bg-[#22232D] rounded-none cursor-pointer border-none shrink-0 flex items-center justify-center transition-colors"
          title="Remover seleção">
          <svg lucideX class="w-2.5 h-2.5"></svg>
        </button>
      </span>
      }
    </div>
  </div>

  <!-- Action buttons -->
  <div
    class="flex items-center gap-3 shrink-0 w-full md:w-auto justify-end border-t md:border-t-0 border-[#2A2B36] pt-3 md:pt-0">
    <button (click)="onClear()"
      class="h-9 px-4 bg-transparent hover:bg-[#1C1D24] border border-transparent hover:border-[#2A2B36] rounded-[3px] text-xs font-bold text-slate-400 hover:text-white cursor-pointer transition-all duration-80 flex items-center gap-1.5 outline-none font-ui uppercase tracking-wider">
      <svg lucideX class="w-3.5 h-3.5"></svg>
      Limpar
    </button>
    <button (click)="onDelete()"
      class="h-9 px-4 bg-[#E8001D] hover:bg-[#B8001A] text-white rounded-[3px] text-xs font-bold shadow-sm hover:shadow-md cursor-pointer transition-all duration-80 flex items-center justify-center gap-2 outline-none font-ui uppercase tracking-wider">
      <svg lucideTrash2 class="w-3.5 h-3.5"></svg>
      Excluir Selecionados
    </button>
  </div>
</div>
