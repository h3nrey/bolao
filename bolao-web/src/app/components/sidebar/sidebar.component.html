<aside class="h-full w-60 bg-[#0D0D0F] border-r border-[#2A2B36] flex flex-col justify-between shrink-0 p-4 rounded-none shadow-sm">
  <div class="flex flex-col">
    <!-- Logo/Brand Component -->
    <div class="mb-8">
      <app-logo></app-logo>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex flex-col gap-2">
      <app-sidebar-item 
        (click)="navigate('/ranking')" 
        [active]="isActive('/ranking')" 
        label="Classificação"
      >
        <svg lucideTrophy class="w-5 h-5"></svg>
      </app-sidebar-item>

      <app-sidebar-item 
        (click)="navigate('/participantes')" 
        [active]="isActive('/participantes')" 
        label="Participantes"
      >
        <svg lucideUsers class="w-5 h-5"></svg>
      </app-sidebar-item>

      <app-sidebar-item 
        (click)="navigate('/partidas')" 
        [active]="isActive('/partidas')" 
        label="Partidas"
      >
        <svg lucideCalendar class="w-5 h-5"></svg>
      </app-sidebar-item>

      <app-sidebar-item 
        (click)="navigate('/especiais')" 
        [active]="isActive('/especiais')" 
        label="Especiais"
      >
        <svg lucideAward class="w-5 h-5"></svg>
      </app-sidebar-item>

      <app-sidebar-item 
        (click)="navigate('/regras')" 
        [active]="isActive('/regras')" 
        label="Regras"
      >
        <svg lucideFileText class="w-5 h-5"></svg>
      </app-sidebar-item>

      @if (user()?.is_admin) {
        <app-sidebar-item 
          (click)="navigate('/admin')" 
          [active]="isActive('/admin')" 
          label="Administração"
        >
          <svg lucideShield class="w-5 h-5"></svg>
        </app-sidebar-item>
      }
    </nav>

    <!-- Quick Prediction Button -->
    <div class="mt-6 px-1">
      <button 
        (click)="quickBetRequested.emit()"
        class="w-full py-2.5 px-4 bg-[#E8001D] hover:bg-[#FF1A35] text-white text-[10px] font-black uppercase tracking-wider rounded-[6px] border-none cursor-pointer flex items-center justify-center gap-2 transition-all duration-150 shadow-md hover:shadow-lg font-ui"
        title="Palpitar Rapidamente"
      >
        <svg lucidePlus class="w-4 h-4 block"></svg>
        <span>Palpite Rápido</span>
      </button>
    </div>
  </div>

  <!-- Reusable User Profile Footer Atom -->
  <app-user-profile-footer 
    [user]="user()" 
    (logoutRequested)="onLogout()"
    (profileRequested)="navigate('/perfil')"
  ></app-user-profile-footer>
</aside>
